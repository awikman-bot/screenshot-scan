# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The only package manifest is package.json, which holds dev tooling (eslint).
# The extension itself ships no npm dependencies, so these PRs never change
# what users install. The github-actions entry keeps the CI and release workflows current.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dev-only tooling: one grouped PR per week instead of one per package.
    groups:
      dev-tooling:
        patterns:
          - "*"
    ignore:
      # Pinned to a GitLab commit on purpose; Dependabot cannot track it.
      - dependency-name: "eslint-config-gnome"
      # eslint-config-gnome (and gnome-shell itself) targets ESLint 9; with
      # ESLint 10 its no-shadow rule rejects the GObject.registerClass idiom.
      # Take ESLint majors only once eslint-config-gnome supports them.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
